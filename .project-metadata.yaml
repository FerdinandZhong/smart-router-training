name: Smart Router Training
description: >-
  Self-contained decision-model training pilot with repository-included data,
  an isolated PyTorch environment and a dedicated Ray head.
  Import creates the CPU head, two L40S GPU workers, the training dashboard and TensorBoard, then
  waits for Ray to report both GPU nodes alive. Configure cross-pod collective networking manually,
  then launch the cluster smoke from the dashboard (cluster-smoke remains available as a manual job).
author: Smart Router Training
date: '2026-09-29'
specification_version: '1.0'
prototype_version: '0.1'
runtimes:
  - editor: JupyterLab
    kernel: Python 3.11
    edition: Standard
environment_variables:
  TENSORBOARD_SUBDOMAIN:
    default: smart-router-tensorboard
    description: Unique authenticated TensorBoard Application subdomain.
    required: false
  RAY_HEAD_SUBDOMAIN:
    default: smart-router-ray-head
    description: Unique head Application subdomain for this training AMP.
    required: false
  TRAINING_DASHBOARD_SUBDOMAIN:
    default: smart-router-training-dashboard
    description: Unique authenticated training dashboard Application subdomain.
    required: false
  RAY_WORKER_CPU:
    default: '12'
    description: CPU cores per GPU worker.
    required: false
  RAY_WORKER_MEMORY:
    default: '80'
    description: Memory in GiB per GPU worker.
    required: false
  RAY_WORKER_GPUS:
    default: '1'
    description: GPUs per worker.
    required: false
  RAY_WORKER_ACCELERATOR_TYPE:
    default: L40S
    description: GPU accelerator type per worker.
    required: false
  RAY_HEAD_CPU:
    default: '8'
    description: CPU cores for the head Application.
    required: false
  RAY_HEAD_MEMORY:
    default: '32'
    description: Head Application memory in GiB.
    required: false
tasks:
  - type: create_job
    name: validate_pilot
    entity_label: validate-pilot
    script: amp/validate_pilot.py
    kernel: python3
    cpu: 1
    memory: 2
    timeout: 5
  - type: run_job
    entity_label: validate-pilot
    wait_for: true
  - type: create_job
    name: configure_project_resources
    entity_label: configure-project-resources
    script: amp/configure_project_resources.py
    kernel: python3
    cpu: 1
    memory: 2
    timeout: 5
  - type: run_job
    entity_label: configure-project-resources
    wait_for: true
  - type: create_job
    name: setup_cluster_environment
    entity_label: setup-cluster-environment
    script: amp/setup_cluster_environment.py
    kernel: python3
    cpu: 4
    memory: 16
    timeout: 45
  - type: run_job
    entity_label: setup-cluster-environment
    wait_for: true
  - type: create_job
    name: setup_training_environment
    entity_label: setup-training-environment
    script: amp/setup_training_environment.py
    kernel: python3
    cpu: 4
    memory: 16
    timeout: 45
  - type: run_job
    entity_label: setup-training-environment
    wait_for: true
  - type: create_job
    name: launch_training_cluster
    entity_label: launch-training-cluster
    script: amp/launch_training_cluster.py
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 25
  - type: run_job
    entity_label: launch-training-cluster
    wait_for: true
  - type: create_job
    name: launch_training_dashboard
    entity_label: launch-training-dashboard
    script: amp/launch_training_dashboard.py
    kernel: python3
    cpu: 1
    memory: 2
    timeout: 5
  - type: run_job
    entity_label: launch-training-dashboard
    wait_for: true
  - type: create_job
    name: launch_tensorboard
    entity_label: launch-tensorboard
    script: amp/launch_tensorboard.py
    kernel: python3
    cpu: 1
    memory: 2
    timeout: 5
  - type: run_job
    entity_label: launch-tensorboard
    wait_for: true
  - type: create_job
    name: check_cluster_ready
    entity_label: check-cluster-ready
    script: amp/check_cluster_ready.py
    kernel: python3
    cpu: 1
    memory: 2
    timeout: 30
  - type: run_job
    entity_label: check-cluster-ready
    wait_for: true
  - type: create_job
    name: cluster-smoke
    entity_label: cluster-smoke
    script: amp/run_cluster_smoke.py
    kernel: python3
    cpu: 1
    memory: 2
    gpu: 0
    timeout: 20
