# CPU head plus two GPU workers (1 x L40S each) for the 2-GPU training demo.
# RAY_WORKER_CPU/MEMORY/GPUS/ACCELERATOR_TYPE override the input_template group at AMP import.
# Runtime images must exist in the target Workbench.
ray_cluster:
  head_cpu: 8
  head_memory: 32
  management_api_cpu: 2
  management_api_memory: 8
  ray_port: 6379
  dashboard_port: 8265
  autoscaling:
    enabled: true
    limits: null
    max_launch_batch: 2
  worker_pools: []
  launch_initial_workers: true
  worker_groups:
    - name: gpu-workers
      node_type: gpu-worker
      count: 2
      cpu: 12
      memory: 80
      gpus: 1
      accelerator_type: L40S
      input_template: true
cai:
  project_name: smart-router-training
  head_app_name: model-training-ray-head
  head_runtime_identifier: docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.11-standard:2026.04.1-b7
  worker_runtime_identifier: docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-pbj-jupyterlab-python3.11-cuda:2026.04.1-b7
monitoring:
  prometheus_host: null
  grafana_host: null
  grafana_iframe_host: null
  grafana_org_id: '1'
environment: {}
